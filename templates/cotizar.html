<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Cotización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Cotizador Freelancer</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/clientes">Clientes</a>
                <a class="nav-link" href="/cola">Cola de Trabajos</a>
                <a class="nav-link active" href="/cotizar">Nueva Cotización</a>
                <a class="nav-link" href="/historial">Historial</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="card shadow-sm p-4">
            <h2 class="h4 mb-3">Iniciar Nueva Cotización</h2>
            {% if not lista_clientes %}
                <div class="alert alert-warning mb-3">
                    [!] No hay clientes registrados en el sistema. Registre uno primero para cotizar.
                </div>
                <a href="/clientes" class="btn btn-primary">Registrar Cliente</a>
            {% else %}
                <form method="POST" action="/cotizar">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Seleccionar Cliente</label>
                        <select name="cliente_id" class="form-select" required>
                            {% for c in lista_clientes %}
                                <option value="{{ c.id }}">ID: {{ c.id }} | {{ c.nombre }} ({{ c.rubro }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Comenzar Cotización</button>
                </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
